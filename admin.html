<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisucha Studio — 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ===== 로그인 화면 ===== -->
  <div id="login-screen" class="admin-screen">
    <div class="login-box">
      <div class="login-logo">
        <span class="login-logo-icon">⬡</span>
        <span class="login-logo-text">Kisucha Studio</span>
      </div>
      <h1 class="login-title">관리자 로그인</h1>
      <div id="login-error" class="login-error" style="display:none;"></div>
      <form id="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="login-username">아이디</label>
          <input type="text" id="login-username" name="username" placeholder="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">비밀번호</label>
          <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-submit-btn">로그인</button>
      </form>
    </div>
  </div>

  <!-- ===== 관리자 대시보드 ===== -->
  <div id="admin-dashboard" class="admin-screen" style="display:none;">

    <header class="admin-header">
      <div class="admin-header-inner">
        <a href="index.html" class="admin-logo">
          <span class="admin-logo-icon">⬡</span>
          <span>Kisucha Studio</span>
        </a>
        <div class="admin-header-right">
          <span id="admin-user-email" class="admin-user-email"></span>
          <button id="logout-btn" class="btn btn-ghost">로그아웃</button>
        </div>
      </div>
    </header>

    <div class="admin-body">

      <nav class="admin-tabs">
        <button class="tab-btn active" data-tab="apps-list">앱 목록</button>
        <button class="tab-btn" data-tab="app-form">앱 등록</button>
        <button class="tab-btn" data-tab="categories">카테고리</button>
      </nav>

      <!-- ===== 탭 1: 앱 목록 ===== -->
      <section id="apps-list" class="tab-content active">
        <div class="tab-header">
          <h2>앱 목록</h2>
          <button class="btn btn-primary" id="goto-add-btn">+ 앱 등록</button>
        </div>
        <div id="apps-table-wrap" class="table-wrap">
          <p class="loading-text">불러오는 중...</p>
        </div>
      </section>

      <!-- ===== 탭 2: 앱 등록/수정 ===== -->
      <section id="app-form" class="tab-content">
        <div class="tab-header">
          <h2 id="form-title">앱 등록</h2>
        </div>
        <form id="app-form-element" class="admin-form" novalidate>
          <input type="hidden" id="editing-app-id">

          <div class="form-row">
            <div class="form-group">
              <label for="f-name-ko">앱 이름 (한국어) *</label>
              <input type="text" id="f-name-ko" name="name_ko" placeholder="타이머 프로" required>
            </div>
            <div class="form-group">
              <label for="f-name-en">App Name (English) *</label>
              <input type="text" id="f-name-en" name="name_en" placeholder="Timer Pro" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="f-desc-ko">설명 (한국어)</label>
              <textarea id="f-desc-ko" name="desc_ko" rows="3" placeholder="앱에 대한 한국어 설명을 입력하세요."></textarea>
            </div>
            <div class="form-group">
              <label for="f-desc-en">Description (English)</label>
              <textarea id="f-desc-en" name="desc_en" rows="3" placeholder="Enter app description in English."></textarea>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="f-category">카테고리</label>
              <select id="f-category" name="category_id">
                <option value="">선택 안 함</option>
              </select>
            </div>
            <div class="form-group">
              <label for="f-status">상태 *</label>
              <select id="f-status" name="status" required>
                <option value="coming-soon">출시 예정</option>
                <option value="released">출시됨</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>플랫폼</label>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" name="platforms" value="android"> Android
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="platforms" value="ios"> iOS
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="platforms" value="windows"> Windows
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="f-icon">앱 아이콘</label>
            <div class="icon-upload-wrap">
              <div id="icon-preview" class="icon-preview" style="display:none;">
                <img id="icon-preview-img" src="" alt="아이콘 미리보기">
              </div>
              <input type="file" id="f-icon" name="icon" accept="image/*">
              <p class="form-hint">권장: 512x512px 이상, 최대 2MB. PNG/JPG/WebP.</p>
              <div id="current-icon-wrap" style="display:none;">
                <p class="form-hint">현재 아이콘: <a id="current-icon-link" href="#" target="_blank">보기</a></p>
                <label class="checkbox-label">
                  <input type="checkbox" id="remove-icon-check"> 아이콘 제거
                </label>
              </div>
            </div>
          </div>

          <fieldset class="form-fieldset">
            <legend>스토어 링크</legend>
            <div class="form-group">
              <label for="f-link-gplay">Google Play</label>
              <input type="url" id="f-link-gplay" name="link_google_play" placeholder="https://play.google.com/store/apps/details?id=...">
            </div>
            <div class="form-group">
              <label for="f-link-astore">App Store</label>
              <input type="url" id="f-link-astore" name="link_app_store" placeholder="https://apps.apple.com/...">
            </div>
            <div class="form-group">
              <label for="f-link-ms">Microsoft Store</label>
              <input type="url" id="f-link-ms" name="link_ms_store" placeholder="https://apps.microsoft.com/...">
            </div>
          </fieldset>

          <div class="form-group form-group-sm">
            <label for="f-sort-order">정렬 순서</label>
            <input type="number" id="f-sort-order" name="sort_order" value="0" min="0" style="width:100px;">
            <p class="form-hint">숫자가 낮을수록 앞에 표시됩니다.</p>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="app-submit-btn">등록</button>
            <button type="button" class="btn btn-ghost" id="app-cancel-btn" style="display:none;">취소</button>
          </div>
        </form>
      </section>

      <!-- ===== 탭 3: 카테고리 ===== -->
      <section id="categories" class="tab-content">
        <div class="tab-header">
          <h2>카테고리 관리</h2>
        </div>

        <div id="categories-list-wrap" class="table-wrap">
          <p class="loading-text">불러오는 중...</p>
        </div>

        <div class="category-add-box">
          <h3>새 카테고리 추가</h3>
          <form id="category-form" class="category-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="c-name-ko">이름 (한국어) *</label>
                <input type="text" id="c-name-ko" name="name_ko" placeholder="유틸리티" required>
              </div>
              <div class="form-group">
                <label for="c-name-en">Name (English) *</label>
                <input type="text" id="c-name-en" name="name_en" placeholder="Utility" required>
              </div>
              <div class="form-group form-group-action">
                <label>&nbsp;</label>
                <button type="submit" class="btn btn-primary">추가</button>
              </div>
            </div>
          </form>
        </div>
      </section>

    </div><!-- .admin-body -->
  </div><!-- #admin-dashboard -->

  <!-- ===== 알림 토스트 ===== -->
  <div id="notification" class="notification" style="display:none;" role="alert" aria-live="polite"></div>

  <script src="admin.js"></script>
</body>
</html>
