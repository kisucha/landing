<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kisucha Studio — Simple, practical utility apps for Android, iOS, and Windows.">
  <title>Kisucha Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">Kisucha Studio</span>
      </a>
      <nav class="header-nav">
        <a href="#apps" class="nav-link" data-ko="앱" data-en="Apps">앱</a>
        <a href="#about" class="nav-link" data-ko="소개" data-en="About">소개</a>
      </nav>
      <button class="lang-toggle" id="langToggle" aria-label="언어 전환">
        <span class="lang-option" id="langKo">KO</span>
        <span class="lang-sep">|</span>
        <span class="lang-option" id="langEn">EN</span>
      </button>
    </div>
  </header>

  <!-- ===== HERO ===== -->
  <section id="hero" class="hero-section">
    <div class="hero-inner">
      <div class="hero-badge">
        <span data-ko="실용 앱 스튜디오" data-en="Utility App Studio">실용 앱 스튜디오</span>
      </div>
      <h1 class="hero-title">
        <span data-ko="심플하게. 실용적으로." data-en="Simple. Practical.">심플하게. 실용적으로.</span>
      </h1>
      <p class="hero-subtitle" data-ko="Android · iOS · Windows 를 위한 유틸리티 앱을 만듭니다." data-en="Crafting utility apps for Android, iOS, and Windows.">
        Android · iOS · Windows 를 위한 유틸리티 앱을 만듭니다.
      </p>
      <div class="hero-platforms">
        <span class="platform-chip android" data-ko="안드로이드" data-en="Android">안드로이드</span>
        <span class="platform-chip ios">iOS</span>
        <span class="platform-chip windows">Windows</span>
      </div>
      <a href="#apps" class="hero-cta" data-ko="앱 보기" data-en="View Apps">앱 보기</a>
    </div>
    <div class="hero-glow" aria-hidden="true"></div>
  </section>

  <!-- ===== APPS ===== -->
  <section id="apps" class="apps-section">
    <div class="section-inner">
      <div class="section-header">
        <h2 class="section-title" data-ko="앱" data-en="Apps">앱</h2>
        <p class="section-subtitle" data-ko="개발 중인 유틸리티 앱 목록입니다." data-en="Utility apps currently in development.">
          개발 중인 유틸리티 앱 목록입니다.
        </p>
      </div>
      <div id="category-filters" class="category-filters"></div>
      <div id="app-grid" class="app-grid">
        <!-- JS가 앱 카드를 여기에 렌더링 -->
      </div>
    </div>
  </section>

  <!-- ===== ABOUT ===== -->
  <section id="about" class="about-section">
    <div class="section-inner about-inner">
      <div class="about-logo" aria-hidden="true">⬡</div>
      <h2 class="about-title" data-ko="Kisucha Studio" data-en="Kisucha Studio">Kisucha Studio</h2>
      <p class="about-text" data-ko="일상의 불편함을 해결하는 심플하고 실용적인 앱을 만듭니다. 광고 기반 무료 앱으로, 누구나 쉽게 사용할 수 있도록 설계합니다." data-en="We build simple, practical apps that solve everyday problems. Free, ad-supported apps designed for everyone.">
        일상의 불편함을 해결하는 심플하고 실용적인 앱을 만듭니다. 광고 기반 무료 앱으로, 누구나 쉽게 사용할 수 있도록 설계합니다.
      </p>
      <div class="about-contact">
        <a href="mailto:kisucha74@gmail.com" class="contact-link">
          <span data-ko="문의하기" data-en="Contact">문의하기</span>
        </a>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copy">
        &copy; <span id="footerYear"></span> Kisucha Studio.
        <span data-ko="All rights reserved." data-en="All rights reserved.">All rights reserved.</span>
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
