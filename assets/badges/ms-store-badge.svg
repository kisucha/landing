<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 40" width="155" height="40" role="img" aria-label="Get it from Microsoft Store">
  <rect width="155" height="40" rx="5" fill="#1a1a2e"/>
  <rect width="155" height="40" rx="5" fill="none" stroke="#444" stroke-width="1"/>
  <!-- Windows logo - 4 squares -->
  <rect x="10" y="11" width="8" height="8" fill="#f35325"/>
  <rect x="19" y="11" width="8" height="8" fill="#81bc06"/>
  <rect x="10" y="20" width="8" height="8" fill="#05a6f0"/>
  <rect x="19" y="20" width="8" height="8" fill="#ffba08"/>
  <!-- Text -->
  <text x="34" y="16" font-family="Arial,sans-serif" font-size="8" fill="#aaa">GET IT FROM</text>
  <text x="34" y="28" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff">Microsoft Store</text>
</svg>
