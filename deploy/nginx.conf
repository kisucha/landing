# Kisucha Studio — Nginx 리버스 프록시 설정
# 복사 위치: /etc/nginx/sites-available/kisucha-studio
# 심볼릭 링크: ln -s /etc/nginx/sites-available/kisucha-studio /etc/nginx/sites-enabled/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.dogsound.net dogsound.net;

    # 업로드 최대 크기 (아이콘 이미지용)
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTPS 설정 (certbot 실행 후 자동 추가됨)
# sudo certbot --nginx -d www.dogsound.net -d dogsound.net
